name: Build CargoPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-cargopulse-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build CargoPulse Debug APK
        run: |
          cd CargoPulse/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload CargoPulse APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargopulse-debug-apk
          path: CargoPulse/android/app/build/outputs/apk/debug/*.apk
