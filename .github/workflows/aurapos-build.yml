name: Build AuraPOS Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aurapos-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Skeleton & Install Dependencies
        run: |
          cd apps/aurapos-flutter
          flutter create --platforms=android --org sa.aurapos.app .
          flutter pub get

      - name: Build Debug APK
        run: |
          cd apps/aurapos-flutter
          flutter build apk --debug

      - name: Upload AuraPOS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurapos-debug-apk
          path: apps/aurapos-flutter/build/app/outputs/flutter-apk/app-debug.apk
